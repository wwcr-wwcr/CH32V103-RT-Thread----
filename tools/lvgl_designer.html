<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>LVGL 图形化设计器 · 界面与任务</title>
<style>
:root{
  --bg:#f7f4f7; --panel:#ffffff; --line:#e8dde6; --text:#3a2e39; --dim:#9a8c98;
  --accent:#ff4f8b; --accent2:#3fc8b4; --sel:#ff4f8b;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden}

/* ---------- 顶部工具栏 ---------- */
#bar{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
#bar .grp{display:flex;gap:4px;align-items:center;padding-right:8px;border-right:1px solid var(--line)}
#bar .grp:last-child{border:none}
button{font:inherit;padding:5px 10px;border:1px solid var(--line);background:#fff;color:var(--text);border-radius:8px;cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri{background:var(--accent2);border-color:var(--accent2);color:#fff}
input,select{font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);width:100%}
label.mini{color:var(--dim);font-size:12px}

/* ---------- 三栏 ---------- */
#main{flex:1;display:flex;min-height:0}
#left{width:174px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:8px}
#paletteFilter{width:100%;margin-bottom:6px}
#taskBindingInfo{overflow-wrap:anywhere;margin-top:6px}
#canvas .k-btnmatrix{display:flex;flex-direction:column;gap:2px;padding:3px;background:#fff}
.matrix-row{display:flex;flex:1;gap:2px;min-height:0}
.matrix-row span{flex:1;min-width:0;overflow:hidden;text-align:center;align-content:center;border-radius:3px;background:#f4eaf0;color:var(--text)}
#right{width:264px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:8px}
#center{flex:1;display:flex;flex-direction:column;min-width:0}

.pal-title{font-size:12px;color:var(--dim);margin:8px 2px 4px}
.pal{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pal .it{padding:6px 4px;border:1px solid var(--line);border-radius:8px;background:#fff;text-align:center;cursor:grab;font-size:12px;user-select:none}
.pal .it:hover{border-color:var(--accent2);background:#f2fdfb}
.pal .it b{display:block;font-weight:600}
.pal .it span{color:var(--dim);font-size:11px}
.pal .it.off{opacity:.55}

/* ---------- 页签 ---------- */
#tabs{display:flex;gap:4px;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
#tabs .tab{padding:4px 10px;border:1px solid var(--line);border-radius:8px 8px 0 0;background:#fff;cursor:pointer;font-size:12px}
#tabs .tab.act{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ---------- 画布 ---------- */
#stage{flex:1;overflow:auto;padding:18px;display:flex;align-items:flex-start;justify-content:center;background:
  linear-gradient(45deg,#efe9ee 25%,transparent 25%,transparent 75%,#efe9ee 75%) 0 0/16px 16px,
  linear-gradient(45deg,#efe9ee 25%,#f7f4f7 25%,#f7f4f7 75%,#efe9ee 75%) 8px 8px/16px 16px}
#zoomWrap{transform-origin:top left}
#canvas{position:relative;background:#fff;box-shadow:0 6px 24px rgba(0,0,0,.12);overflow:hidden;
  background-image:linear-gradient(#00000008 1px,transparent 1px),linear-gradient(90deg,#00000008 1px,transparent 1px);
  background-size:8px 8px}
#canvas{touch-action:none;user-select:none}
#canvas .marquee{position:absolute;border:1px solid var(--sel);background:rgba(255,79,139,.12);pointer-events:none}
#canvas.grid-off{background-image:none}
.w{position:absolute;border:1px dashed transparent;cursor:move;overflow:hidden;user-select:none}
.w.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel) inset}
.w .hd{position:absolute;width:8px;height:8px;background:#fff;border:1px solid var(--sel);border-radius:2px}
.w.dragging{opacity:.85}
#guides{position:absolute;inset:0;pointer-events:none;z-index:60}
.guide{position:absolute;background:#f24e1e;opacity:.9}
.guide.v{width:1px;top:0;height:100%}
.guide.h{height:1px;left:0;width:100%}

/* ---------- 代码弹窗 ---------- */
#codeMask{position:fixed;inset:0;background:#0006;display:none;z-index:999;align-items:center;justify-content:center}
#codeMask.on{display:flex}
#codeBox{width:min(960px,94vw);height:min(80vh,820px);background:#fff;border-radius:14px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 64px #0004}
.cbHead{display:flex;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.cbHead .hint{color:var(--dim);font-size:12px;flex:1;text-align:right}
.tabBtn{padding:3px 10px;font-size:12px;border-radius:999px}
.tabBtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#codeOut{flex:1;border:0;resize:none;padding:12px 14px;width:100%;
  font:12px/1.55 Consolas,"Cascadia Mono",monospace;white-space:pre;overflow:auto;color:#3a2e39;outline:none}

/* 各控件外观 */
.k-card{background:#fff;border:1px solid #ffd9e8;border-radius:22px}
.k-label{display:flex;align-items:center;color:#3a2e39;font-size:12px;white-space:nowrap}
.k-btn{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid #ffd9e8;border-radius:18px;color:#ff4f8b;font-size:12px}
.k-bar{background:#ffd9e8;border-radius:999px;display:flex;align-items:center}
.k-bar i{display:block;height:100%;background:#3fc8b4;border-radius:999px}
.k-slider{background:#ffd9e8;border-radius:999px;position:relative;display:flex;align-items:center}
.k-slider i{height:100%;background:#3fc8b4;border-radius:999px;display:block}
.k-slider u{position:absolute;width:14px;height:14px;border-radius:50%;background:#3a2e39;transform:translateY(-0px)}
.k-chart{border:1px solid #ffd9e8;border-radius:14px;background:
   linear-gradient(#0000000d 1px,transparent 1px) 0 0/100% 25%,
   linear-gradient(90deg,#0000000d 1px,transparent 1px) 0 0/25% 100%,#fff;
   position:relative;overflow:hidden}
.k-chart svg{position:absolute;inset:0;width:100%;height:100%}
.k-switch{background:#ffd9e8;border-radius:999px;position:relative}
.k-switch u{position:absolute;top:2px;right:2px;width:50%;height:calc(100% - 4px);background:#3fc8b4;border-radius:999px}
.k-checkbox{display:flex;align-items:center;gap:6px;color:#3a2e39;font-size:12px}
.k-checkbox b{width:14px;height:14px;border:1px solid #9a8c98;border-radius:4px;display:inline-block}
.k-arc{border-radius:50%;border:6px solid #ffd9e8;border-top-color:#3fc8b4;border-right-color:#3fc8b4}
.k-dd{background:#fff;border:1px solid #ffd9e8;border-radius:10px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:12px;color:#3a2e39}
.k-roller{background:#fff;border:1px solid #ffd9e8;border-radius:10px;overflow:hidden;font-size:12px;color:#9a8c98;display:flex;flex-direction:column;align-items:center;justify-content:center}
.k-ta{background:#fff;border:1px solid #ffd9e8;border-radius:10px;padding:6px 8px;font-size:12px;color:#9a8c98}
.k-led{border-radius:50%;background:#3fc8b4;box-shadow:0 0 12px #3fc8b4aa}
.k-spin{border-radius:50%;border:4px dashed #3fc8b4}
.k-line svg{display:block;width:100%;height:100%}
.k-img{background:#eee;border:1px dashed #bbb;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#999;font-size:18px}
.k-table{background:#fff;border:1px solid #ffd9e8;border-radius:8px;background-image:
  linear-gradient(#00000012 1px,transparent 1px),linear-gradient(90deg,#00000012 1px,transparent 1px);
  background-size:33.33% 33.33%}
.k-meter{border-radius:50%;border:2px solid #ffd9e8;position:relative;background:#fff}
.k-meter i{position:absolute;left:50%;bottom:50%;width:2px;height:38%;background:#ff4f8b;transform-origin:bottom center;transform:rotate(-45deg)}
.k-canvas{background:repeating-linear-gradient(45deg,#f3f3f3,#f3f3f3 6px,#e9e9e9 6px,#e9e9e9 12px);border:1px dashed #bbb;border-radius:6px}
.k-keyboard{background:#fff;border:1px solid #ffd9e8;border-radius:8px;background-image:
  linear-gradient(#00000010 1px,transparent 1px),linear-gradient(90deg,#00000010 1px,transparent 1px);
  background-size:10% 33%;}
.k-calendar,.k-btnmatrix{background:#fff;border:1px solid #ffd9e8;border-radius:8px;background-image:
  linear-gradient(#00000012 1px,transparent 1px),linear-gradient(90deg,#00000012 1px,transparent 1px);
  background-size:14.28% 16.6%}

/* ---------- 右侧面板 ---------- */
.sec{margin-bottom:10px}
.sec h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;letter-spacing:.5px}
.row{display:flex;gap:6px;margin-bottom:6px}
.row>div{flex:1;min-width:0}
.fld{display:flex;flex-direction:column;gap:2px}
.fld label{font-size:11px;color:var(--dim)}
#layers{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px}
#layers .ly{display:flex;align-items:center;gap:6px;padding:4px 6px;font-size:12px;cursor:pointer;border-bottom:1px solid #f3eef2}
#layers .ly:last-child{border:none}
#layers .ly.act{background:#fff0f5}
#layers .ly em{flex:1;font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#layers .ly span{color:var(--dim);font-size:11px}
.hint{color:var(--dim);font-size:11px;line-height:1.5}

/* ---------- 状态栏 ---------- */
#status{display:flex;gap:16px;padding:4px 10px;background:var(--panel);border-top:1px solid var(--line);font-size:12px;color:var(--dim)}
</style>
</head>
<body>

<header id="bar">
  <div class="grp">
    <button id="btnNew">新建</button>
    <button id="btnClear" title="一键清空当前页的控件（Ctrl+Z 可撤销）；Shift+点击 = 清空所有页">清空</button>
    <button id="btnDemo">示例</button>
    <button id="btnOpen">打开…</button>
    <button id="btnPickC" title="选择一个任务 .c 和对应的 .h，从文件级变量中选择控件数据">绑定 C / H…</button>
    <button id="btnSave">保存工程</button>
  </div>
  <div class="grp">
    <button id="btnUndo" title="Ctrl+Z">撤销</button>
    <button id="btnRedo" title="Ctrl+Y">重做</button>
  </div>
  <div class="grp">
    <button id="btnPortrait" class="on">竖屏 320×480</button>
    <button id="btnLandscape">横屏 480×320</button>
  </div>
  <div class="grp">
    <button id="btnGrid" class="on">网格</button>
    <select id="snapMode" style="width:118px" title="Alt 拖动 = 临时不吸附">
      <option value="both" selected>智能对齐+网格</option>
      <option value="smart">仅智能对齐</option>
      <option value="grid">仅网格 8px</option>
      <option value="off">不吸附</option>
    </select>
    <select id="zoom" style="width:86px">
      <option value="0.5">50%</option>
      <option value="0.75">75%</option>
      <option value="1" selected>100%</option>
      <option value="1.25">125%</option>
      <option value="1.5">150%</option>
    </select>
  </div>
  <div class="grp" style="margin-left:auto">
    <button id="btnCode">查看 / 复制代码</button>
    <button id="btnTaskGenerator" class="pri">生成任务三件套</button>
  </div>
</header>

<div id="main">
  <aside id="left"></aside>
  <section id="center">
    <div id="tabs"></div>
    <div id="stage"><div id="zoomWrap"><div id="canvas"></div></div></div>
  </section>
  <aside id="right">
    <div class="sec">
      <h4>工程</h4>
      <div class="row"><div class="fld"><label>文件名前缀</label><input id="projName" value="app_ui"></div></div>
      <div class="row"><div class="fld"><label><input type="checkbox" id="genTask" style="width:auto"> 代码预览中包含任务骨架</label></div></div>
      <div class="hint">目标为 LVGL 8.2.0 · LVGL_Demo.h。三件套写入 <b>User/&lt;任务名&gt;/</b>。</div>
      <div class="hint" id="taskBindingInfo" role="status"></div>
      <details id="taskFunctions" hidden><summary></summary><ul style="padding-left:18px;overflow-wrap:anywhere"></ul></details>
      <button type="button" id="btnDetachTask" hidden>解除文件绑定</button>
    </div>
    <div class="sec">
      <h4>属性</h4>
      <div id="inspector"><div class="hint">先在画布上选一个控件。</div></div>
    </div>
    <div class="sec">
      <h4>图层（后加的在上）</h4>
      <div id="layers"></div>
      <div class="row" style="margin-top:6px">
        <button id="lyUp">上移</button><button id="lyDown">下移</button><button id="lyDel" title="删除选中控件及其子控件，可撤销">删除</button>
      </div>
    </div>
    <div class="sec">
      <h4 id="alignTitle">对齐到页面</h4>
      <div class="row">
        <button data-al="l">左</button><button data-al="c">中</button><button data-al="r">右</button>
      </div>
      <div class="row">
        <button data-al="t">上</button><button data-al="m">中</button><button data-al="b">下</button>
      </div>
      <div class="row">
        <button data-al="dx" title="选中三个或更多控件后，使水平间距相等">水平等距</button>
        <button data-al="dy" title="选中三个或更多控件后，使垂直间距相等">垂直等距</button>
      </div>
    </div>
  </aside>
</div>

<footer id="status">
  <span id="stPos">—</span><span id="stSel">未选中</span><span id="stTip">空白处拖动框选 · Ctrl/Shift 点选 · 方向键微调 · Ctrl+D 创建副本</span>
</footer>

<div id="codeMask">
  <div id="codeBox">
    <div class="cbHead">
      <button id="tabUI" class="tabBtn on">界面 .c</button>
      <button id="tabTask" class="tabBtn" disabled>task .c（已同步）</button>
      <b id="codeName">app_ui.c</b>
      <span class="hint" id="codeHint">整段复制，粘到一个 .c 里就能编</span>
      <button id="btnCopyCode" class="pri">复制当前页</button>
      <button id="btnCloseCode">关闭</button>
    </div>
    <textarea id="codeOut" spellcheck="false"></textarea>
  </div>
</div>

<input type="file" id="fileIn" accept=".json" style="display:none">
<input type="file" id="fileC" accept=".c,.h,.txt" multiple style="display:none">
<datalist id="varpool"></datalist>

<script>
/* ============================================================================
 *  LVGL 可视化设计器 —— 生成调用 APP/LVGL_DEMO/LVGL_Demo.h 的 C 代码
 * ========================================================================== */

/* ---------- 控件表：type -> 生成函数 / 默认属性 / 需要的 lv_conf 宏 ---------- */
const W = {
  card:     {n:'卡片',   fn:'ui_card_new',     need:'',            d:{w:240,h:100,radius:22}},
  label:    {n:'文字',   fn:'ui_label_at',     need:'',            d:{w:80,h:20,text:'TEXT',color:'TEXT'}},
  btn:      {n:'按钮',   fn:'ui_btn_new',      need:'LV_USE_BTN',  d:{w:96,h:48,text:'BTN',code:1}},
  bar:      {n:'进度条', fn:'ui_bar_new',      need:'LV_USE_BAR',  d:{w:200,h:10,min:0,max:100,val:60}},
  slider:   {n:'滑条',   fn:'ui_slider_new',   need:'LV_USE_SLIDER',d:{w:200,h:8,min:0,max:100,val:50,code:200}},
  chart:    {n:'图表',   fn:'ui_chart_new',    need:'LV_USE_CHART',d:{w:280,h:130,max:1000,points:64,dataSrc:'demo'}},
  switch:   {n:'开关',   fn:'ui_switch_new',   need:'LV_USE_SWITCH',d:{w:56,h:28,code:1}},
  checkbox: {n:'复选框', fn:'ui_checkbox_new', need:'LV_USE_CHECKBOX',d:{w:110,h:22,text:'OPT',code:1}},
  arc:      {n:'圆弧',   fn:'ui_arc_new',      need:'LV_USE_ARC',  d:{w:100,h:100,min:0,max:100,val:50,code:1}},
  dropdown: {n:'下拉框', fn:'ui_dropdown_new', need:'LV_USE_DROPDOWN',d:{w:150,h:40,options:'AUTO\nMANUAL\nOFF',code:1}},
  roller:   {n:'滚轮',   fn:'ui_roller_new',   need:'LV_USE_ROLLER',d:{w:100,h:110,options:'ONE\nTWO\nTHREE',code:1}},
  textarea: {n:'输入框', fn:'ui_textarea_new', need:'LV_USE_TEXTAREA',d:{w:200,h:44,text:'hint',code:1}},
  keyboard: {n:'键盘',   fn:'ui_keyboard_new', need:'LV_USE_KEYBOARD',d:{w:320,h:140,code:1}},
  calendar: {n:'日历',   fn:'ui_calendar_new', need:'LV_USE_CALENDAR',d:{w:260,h:220,code:1}},
  led:      {n:'指示灯', fn:'ui_led_new',      need:'LV_USE_LED',  d:{w:22,h:22,color:'ACCENT'}},
  spinner:  {n:'转圈',   fn:'ui_spinner_new',  need:'LV_USE_SPINNER',d:{w:48,h:48,ms:1000}},
  line:     {n:'折线',   fn:'ui_line_new',     need:'LV_USE_LINE', d:{w:200,h:80}},
  img:      {n:'图片',   fn:'ui_img_new',      need:'LV_USE_IMG',  d:{w:64,h:64}},
  table:    {n:'表格',   fn:'ui_table_new',    need:'LV_USE_TABLE',d:{w:260,h:110,rows:3,cols:3}},
  meter:    {n:'仪表',   fn:'ui_meter_new',    need:'LV_USE_METER',d:{w:120,h:120,min:0,max:100,val:50}},
  canvas:   {n:'画布',   fn:'ui_canvas_new',   need:'LV_USE_CANVAS',d:{w:120,h:80}},
  btnmatrix:{n:'按钮矩阵',fn:'ui_btnmatrix_new',need:'LV_USE_BTNMATRIX',d:{w:220,h:80,options:'1,2,3\n4,5,6',code:1}},
};
const GROUPS = [
  ['基础', ['card','label','btn','bar','slider','chart']],
  ['输入', ['switch','checkbox','textarea','dropdown','roller','btnmatrix','keyboard']],
  ['显示', ['led','spinner','arc','meter','line','img','table','canvas','calendar']],
];
/* ---------- 每种控件的专属选项（属性面板里自动出现） ---------- */
const EXTRA = {
  chart: [
    {k:'chartMode', label:'显示模式', type:'select', def:'push',
     opts:[['push','时间序列（VEML7700/温度等慢变量）'],['scope','ADC 波形快照（示波器）'],['spectrum','频谱柱（FFT）']]},
    {k:'chartType', label:'图形样式', type:'select', def:'line', opts:[['line','折线'],['bar','柱状']]},
    {k:'divH', label:'横向网格线', def:'4'},
    {k:'divV', label:'纵向网格线', def:'6'},
    {k:'yTicks', label:'Y 轴刻度数（0 = 不画）', def:'4'},
    {k:'yUnit', label:'Y 轴单位（如 mV，留空不画）', def:''},
  ],
  bar: [
    {k:'barDir', label:'方向', type:'select', def:'h', opts:[['h','横向（lv_bar）'],['v','竖向（两层 obj 拼）']]},
  ],
  label: [
    {k:'longMode', label:'超长处理', type:'select', def:'none',
     opts:[['none','不处理（单行）'],['wrap','自动换行'],['dot','末尾省略号'],['scroll','循环滚动']]},
  ],
  btn: [
    {k:'btnStyle', label:'样式', type:'select', def:'normal',
     opts:[['normal','普通'],['primary','主操作（强调色）'],['warn','警示（玫红）'],['ghost','幽灵（透明）']]},
  ],
  switch:   [{k:'initOn', label:'初始打开', type:'bool', def:'0'}],
  checkbox: [{k:'initOn', label:'初始勾选', type:'bool', def:'0'}],
  dropdown: [{k:'selected', label:'默认选中（0 开始）', def:'0'}],
  roller:   [{k:'selected', label:'默认选中（0 开始）', def:'0'},
             {k:'visible', label:'可见行数', def:'3'}],
  textarea: [{k:'oneLine', label:'单行模式', type:'bool', def:'1'},
             {k:'maxLen', label:'最大长度（0=不限）', def:'0'},
             {k:'password', label:'密码模式', type:'bool', def:'0'}],
  table:    [{k:'headers', label:'表头（逗号分隔，留空不填）', def:''}],
  arc:      [{k:'angStart', label:'起始角度', def:'135'},
             {k:'angEnd', label:'结束角度', def:'45'}],
  led:      [{k:'initOn', label:'初始点亮', type:'bool', def:'1'}],
  img:      [{k:'imgName', label:'图片资源变量名（留空显示内置图标）', def:''}],
};

/* genWidget 往这里塞"额外声明"和"额外函数"，genCode 统一输出 */
let GEN_AUX = { decl: [], vbar: [] };

/* 生成代码时对颜色枚举做映射 */
const COLORS = {TEXT:'UI_C_TEXT', DIM:'UI_C_TEXT_DIM', VALUE:'UI_C_VALUE', ACCENT:'UI_C_ACCENT'};

/* ---------- 状态 ---------- */
let S = {
  name:'app_ui',
  landscape:false,
  screens:[{name:'Screen1', widgets:[]}],
  cur:0,
  sel:-1,
  seq:1,
  grid:true, snap:true, snapMode:'both', zoom:1,
};
let history=[], future=[];

function W_(w){return S.landscape?480:320}   /* 画布宽 */
function H_(){return S.landscape?320:480}    /* 画布高 */

/* ---------- 小工具 ---------- */
const $ = s=>document.querySelector(s);
const el = (t,c,x)=>{const e=document.createElement(t); if(c)e.className=c; if(x!=null)e.textContent=x; return e;};
const scr = ()=>S.screens[S.cur];
const wid = i=>scr().widgets[i];

function recordSnapshot(state){history.push(state); if(history.length>60) history.shift(); future.length=0;}
function snapshot(){recordSnapshot(JSON.stringify(S.screens));}
function undo(){
  if(!history.length) return;
  const s=JSON.parse(history.pop());
  if(!Array.isArray(s)) return;
  future.push(JSON.stringify(S.screens));
  S.screens=s; S.cur=Math.min(S.cur,s.length-1); S.sel=-1; renderAll();
}
function redo(){
  if(!future.length) return;
  const s=JSON.parse(future.pop());
  if(!Array.isArray(s)) return;
  history.push(JSON.stringify(S.screens));
  S.screens=s; S.cur=Math.min(S.cur,s.length-1); S.sel=-1; renderAll();
}

/* ---------- 左侧控件面板 ---------- */
const referenceEnabled=new Set(['LV_USE_BTN','LV_USE_BAR','LV_USE_SLIDER','LV_USE_CHART','LV_USE_CANVAS','LV_USE_IMG','LV_USE_LINE']);
let widgetFlags=new Map(Object.values(W).filter(d=>d.need).map(d=>[d.need,referenceEnabled.has(d.need)]));
let widgetFlagSource='参考工程';
function setWidgetConfig(source){
  const flags=new Map();
  const defines=(source||'').replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*/g,' ');
  for(const m of defines.matchAll(/^[ \t]*#[ \t]*define[ \t]+(LV_USE_\w+)[ \t]+\(?([01])\)?[ \t]*\r?$/gm)){
    flags.set(m[1],m[2]==='1');
  }
  widgetFlags=flags; widgetFlagSource='所选工程';
  refreshPaletteFlags();
}
function refreshPaletteFlags(){
  for(const item of document.querySelectorAll('#left [data-widget]')){
    const macro=W[item.dataset.widget].need;
    if(!macro) continue;
    const enabled=widgetFlags.get(macro);
    const status=enabled===true?'已启用':enabled===false?'需启用':'待确认';
    item.classList.toggle('off',enabled===false);
    item.querySelector('span').textContent=status;
    item.title=widgetFlagSource+' · '+macro+' · '+status;
  }
}
function disabledWidgetMacros(){
  const used=S.screens.flatMap(page=>page.widgets.map(w=>W[w.type].need));
  return [...new Set(used.filter(m=>m && widgetFlags.get(m)===false))];
}
function buildPalette(){
  const L=$('#left'); L.innerHTML='';
  const filter=document.createElement('input');
  filter.type='search'; filter.id='paletteFilter'; filter.placeholder='查找控件…';
  filter.setAttribute('aria-label','按名称、函数或宏查找控件');
  L.appendChild(filter);
  const groups=[];
  GROUPS.forEach(([g,list])=>{
    const heading=el('div','pal-title',g);
    L.appendChild(heading);
    const box=el('div','pal');
    list.forEach(t=>{
      const d=W[t];
      const it=el('div','it'+(d.need?' off':''));
      it.innerHTML='<b>'+d.n+'</b><span>'+(d.need?d.need.replace('LV_USE_',''):'基础')+'</span>';
      it.title=d.need?('需要 '+d.need+' = 1（生成的代码会带 #if 保护）'):'不需要额外宏';
      it.onclick=()=>addWidget(t);
      it.draggable=true;
      it.dataset.widget=t;
      it.dataset.search=[g,d.n,t,d.fn,d.need].join(' ').toLowerCase();
      it.ondragstart=e=>{
        e.dataTransfer.effectAllowed='copy';
        e.dataTransfer.setData('application/x-lvgl-widget',t);
      };
      box.appendChild(it);
    });
    L.appendChild(box);
    groups.push({heading,box});
  });
  const tip=el('div','hint');
  tip.style.marginTop='10px';
  tip.textContent='点击添加，或拖到画布指定位置。';
  L.appendChild(tip);
  refreshPaletteFlags();
  filter.oninput=()=>{
    const query=filter.value.trim().toLowerCase();
    let count=0;
    for(const {heading,box} of groups){
      let visible=0;
      for(const item of box.children){
        item.hidden=!item.dataset.search.includes(query);
        if(!item.hidden) visible++;
      }
      heading.hidden=!visible; box.style.display=visible?'':'none'; count+=visible;
    }
    tip.textContent=count?'点击添加，或拖到画布指定位置。':'找不到匹配的控件。';
  };
}

/* ---------- 加控件 ---------- */
function addWidget(type,point){
  const d=W[type]; if(!d)return;
  snapshot();
  const names=new Set(S.screens.flatMap(page=>page.widgets.map(w=>w.name)));
  let name;
  do { name=type+(S.seq++); } while(names.has(name));
  const n={type,name,x:12,y:12,...JSON.parse(JSON.stringify(d.d))};
  /* 级联偏移，避免叠在一起 */
  const k=scr().widgets.length;
  n.x=8+(k%8)*12; n.y=64+Math.floor(k/8)*12;
  if(n.w>W_()-16)n.w=W_()-16;
  if(n.h>H_()-24)n.h=H_()-24;
  if(point){
    n.x=Math.max(0,Math.min(Math.round(point.x),W_()-n.w));
    n.y=Math.max(0,Math.min(Math.round(point.y),H_()-n.h));
  }
  n.parent=-1;
  scr().widgets.push(n);
  S.sel=scr().widgets.length-1;
  renderAll();
}

const widgetMime='application/x-lvgl-widget';
$('#canvas').addEventListener('dragover',e=>{
  if(e.dataTransfer.types.includes(widgetMime)){ e.preventDefault(); e.dataTransfer.dropEffect='copy'; }
});
$('#canvas').addEventListener('drop',e=>{
  const type=e.dataTransfer.getData(widgetMime);
  if(!Object.hasOwn(W,type)) return;
  e.preventDefault();
  const bounds=e.currentTarget.getBoundingClientRect();
  addWidget(type,{x:(e.clientX-bounds.left)*W_()/bounds.width,y:(e.clientY-bounds.top)*H_()/bounds.height});
});

/* ---------- 画布渲染 ---------- */
function matrixRows(widget){
  return String(widget.options ?? W.btnmatrix.d.options).split(/\r?\n/)
    .map(row=>row.split(/[,，]/).map(label=>label.trim()).filter(Boolean)).filter(row=>row.length);
}
function widgetNode(w,i){
  const n=el('div','w k-'+w.type);
  const ax=absOf(w);
  n.style.left=ax.x+'px'; n.style.top=ax.y+'px';
  n.style.width=w.w+'px'; n.style.height=w.h+'px';
  n.dataset.i=i;
  if(selected.has(i))n.classList.add('sel');

  switch(w.type){
    case 'card': n.style.borderRadius=(w.radius||22)+'px'; break;
    case 'label': n.textContent=w.text||''; n.style.color=colorOf(w.color); n.style.alignItems='center'; break;
    case 'btn':   n.textContent=w.text||''; break;
    case 'btnmatrix':
      for(const labels of matrixRows(w)){
        const row=el('div','matrix-row');
        row.append(...labels.map(label=>el('span','',label))); n.appendChild(row);
      }
      break;
    case 'bar':   n.innerHTML='<i style="width:'+pct(w.val,w.min,w.max)+'%"></i>'; n.style.height=w.h+'px'; break;
    case 'slider':n.innerHTML='<i style="width:'+pct(w.val,w.min,w.max)+'%"></i><u style="left:calc('+pct(w.val,w.min,w.max)+'% - 7px);top:calc(50% - 7px)"></u>'; break;
    case 'chart': n.innerHTML=chartSVG(w); break;
    case 'switch':n.innerHTML='<u></u>'; break;
    case 'checkbox':n.innerHTML='<b></b>'+esc(w.text||''); break;
    case 'arc':   n.style.borderWidth='6px'; break;
    case 'dropdown':n.innerHTML='<span>'+esc(String(w.options||'').split('\n')[0])+'</span><span>▾</span>'; break;
    case 'roller':n.innerHTML='<div>'+String(w.options||'').split('\n').slice(0,3).map(esc).join('<br>')+'</div>'; break;
    case 'textarea':n.textContent=w.text||''; break;
    case 'led':   n.style.background=colorOf(w.color); break;
    case 'spinner':n.style.borderColor='#3fc8b4'; break;
    case 'img':   n.textContent='🖼'; break;
    case 'line':  n.innerHTML='<svg viewBox="0 0 100 100" preserveAspectRatio="none"><line x1="0" y1="100" x2="100" y2="0" stroke="#3fc8b4" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>'; break;
    case 'meter': n.innerHTML='<i style="transform:rotate('+( -45 + 270*pct(w.val,w.min,w.max)/100 )+'deg)"></i>'; break;
    default: break;
  }

  /* 选中框的 8 个缩放手柄 */
  if(selected.size===1 && selected.has(i)){
    [['nw',-4,-4],['n','50%',-4],['ne','100%',-4],['w',-4,'50%'],['e','100%','50%'],['sw',-4,'100%'],['s','50%','100%'],['se','100%','100%']]
    .forEach(([dir,lx,ly])=>{
      const h=el('div','hd'); h.dataset.dir=dir;
      if(typeof lx==='number')h.style.left=(lx)+'px'; else h.style.left='calc('+lx+' - 4px)';
      if(typeof ly==='number')h.style.top=(ly)+'px'; else h.style.top='calc('+ly+' - 4px)';
      h.style.cursor=dir+'-resize';
      n.appendChild(h);
    });
  }
  return n;
}
function colorOf(c){return c==='DIM'?'#9a8c98':c==='VALUE'?'#ff4f8b':c==='ACCENT'?'#3fc8b4':'#3a2e39';}
function pct(v,min,max){const m=(max-min)||1; let p=((v-min)/m)*100; return Math.max(0,Math.min(100,isNaN(p)?0:p));}
function chartSVG(w){
  const n=Math.max(8,Math.min(120,w.points||64)); let d='';
  for(let i=0;i<n;i++){
    const x=(i/(n-1))*100;
    const y=50-38*Math.sin(i/6)*(0.6+0.4*Math.sin(i/17));
    d+=(i?'L':'M')+x.toFixed(1)+' '+(50-y).toFixed(1)+' ';
  }
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><path d="'+d+'" fill="none" stroke="#3fc8b4" stroke-width="1.5"/></svg>';
}

function renderCanvas(){
  const c=$('#canvas');
  c.style.width=W_()+'px'; c.style.height=H_()+'px';
  c.classList.toggle('grid-off',!S.grid);
  c.innerHTML='';
  scr().widgets.forEach((w,i)=>c.appendChild(widgetNode(w,i)));
  const gd=el('div'); gd.id='guides'; c.appendChild(gd);
  $('#zoomWrap').style.transform='scale('+S.zoom+')';
  $('#zoomWrap').style.width=(W_()*S.zoom)+'px';
  $('#zoomWrap').style.height=(H_()*S.zoom)+'px';
}

/* ---------- 页签 ---------- */
function renderTabs(){
  const t=$('#tabs'); t.innerHTML='';
  S.screens.forEach((s,i)=>{
    const b=el('div','tab'+(i===S.cur?' act':''),s.name);
    b.onclick=()=>{S.cur=i;S.sel=-1;renderAll();};
    b.ondblclick=()=>{const n=prompt('页名',s.name); if(n){s.name=n;renderAll();}};
    t.appendChild(b);
  });
  const add=el('button',null,'+ 页'); add.style.padding='2px 8px';
  add.onclick=()=>{snapshot();S.screens.push({name:'Screen'+(S.screens.length+1),widgets:[]});S.cur=S.screens.length-1;S.sel=-1;renderAll();};
  t.appendChild(add);
  const del=el('button',null,'删页'); del.style.padding='2px 8px';
  del.onclick=()=>{ if(S.screens.length<2)return; if(!confirm('删除当前页？'))return; snapshot();S.screens.splice(S.cur,1);S.cur=Math.max(0,S.cur-1);S.sel=-1;renderAll(); };
  t.appendChild(del);
}

function renderLayers(){
  const L=$('#layers'); L.innerHTML='';

  scr().widgets.forEach((w,i)=>{
    const r=el('div','ly'+(selected.has(i)?' act':''));

function renderInspector(){

  if(selected.size>1){
    box.innerHTML='<div class="hint">'+selected.size+' 个控件已选。可整体拖动、对齐，或用 Ctrl+C / Ctrl+V 跨页复制。</div>';
    return;
  }
  if(S.sel<0||!wid(S.sel)){box.innerHTML='<div class="hint">先在画布上选一个控件。</div>';return;}
  const w=wid(S.sel);
  box.innerHTML='';
  /* 名称 + 父级 */
  const r0=el('div','row');
  r0.innerHTML='<div class="fld"><label>变量名</label><input id="f_name" value="'+esc(w.name)+'"></div>';
  box.appendChild(r0);
  const r1=el('div','row');
  const opts=[[-1,'<页面本身>']];
  scr().widgets.forEach((o,i)=>{
    if(o.type==='card' && i!==S.sel && !hasSelectedAncestor(o,selected))opts.push([i,o.name]);
  });
  r1.innerHTML='<div class="fld"><label>父级（放进卡片）</label><select id="f_parent">'+
     opts.map(([v,t])=>'<option value="'+v+'"'+((w.parent ?? -1)===v?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select></div>';

  }

  /* 绑定形参：让 render() 自动长出一个参数，并生成对应的 set 代码 */
  if(['label','bar','chart','led','slider','arc'].includes(w.type)){
    const d0=el('div','row');
    d0.innerHTML='<div class="fld"><label>绑定形参名（留空=不绑定）</label>'+
      '<input id="f_bind" list="varpool" placeholder="打字或从下拉里选" value="'+esc(w.bind||'')+'"></div>';
    box.appendChild(d0);

    const d0b=el('div','row');
    d0b.innerHTML='<div class="fld"><label>类型</label><select id="f_bindType">'+
      ['int32_t','uint32_t','uint16_t','uint8_t','int16_t','int8_t','char','float','double','const char *']
      .map(tp=>'<option value="'+tp+'"'+((w.bindType||'int32_t')===tp?' selected':'')+'>'+tp+'</option>').join('')+
      '</select></div>';
    box.appendChild(d0b);

    if(w.type==='label'){
      const d0c=el('div','row');
      d0c.innerHTML='<div class="fld"><label>数字格式（%d / %.2f，留空自动）</label>'+
        '<input id="f_bindFmt" value="'+esc(w.bindFmt||'')+'"></div>';
      box.appendChild(d0c);
    }
  }

  if(w.type==='chart'){
    const d1=el('div','row');
    d1.innerHTML='<div class="fld"><label>数据来源（生成对应的函数）</label><select id="f_dataSrc">'+
      [['push','单点推进：xxx_push(值)'],['array','整帧数组：xxx_set(数组,个数)'],
       ['ext','外部数组绑定：xxx_data() 直接写（零拷贝）'],['demo','内置演示正弦（先看效果）']]
      .map(o=>'<option value="'+o[0]+'"'+((w.dataSrc||'demo')===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+
      '</select></div>';
    box.appendChild(d1);
  }

  /* 控件专属选项 */
  (EXTRA[w.type]||[]).forEach(f=>{
    const d=el('div','row');
    const cur=(w[f.k]!==undefined && w[f.k]!=='') ? w[f.k] : f.def;
    if(f.type==='select'){
      d.innerHTML='<div class="fld"><label>'+f.label+'</label><select id="f_'+f.k+'">'+
        f.opts.map(o=>'<option value="'+o[0]+'"'+(String(cur)===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+
        '</select></div>';
    }else if(f.type==='bool'){
      d.innerHTML='<div class="fld"><label><input type="checkbox" id="f_'+f.k+'" style="width:auto"'+
        (String(cur)==='1'?' checked':'')+'> '+f.label+'</label></div>';
    }else{
      d.innerHTML='<div class="fld"><label>'+f.label+'</label><input id="f_'+f.k+'" value="'+esc(cur)+'"></div>';
    }
    box.appendChild(d);
  });

  (FIELDS_BY_TYPE[w.type]||[]).forEach(k=>{
    const [lab,kind]=FIELDS[k];
    const d=el('div','row');
    const val=w[k]==null?'':w[k];
    if(kind==='area'){
      d.innerHTML='<div class="fld"><label>'+lab+'</label><textarea id="f_'+k+'" rows="3" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;padding:4px 6px">'+esc(val)+'</textarea></div>';
    }else if(kind==='color'){
      d.innerHTML='<div class="fld"><label>'+lab+'</label><select id="f_'+k+'">'+
        Object.keys(COLORS).map(c=>'<option value="'+c+'"'+(val===c?' selected':'')+'>'+c+'</option>').join('')+'</select></div>';
    }else{
      d.innerHTML='<div class="fld"><label>'+lab+'</label><input id="f_'+k+'" type="'+(kind==='num'?'number':'text')+'" value="'+esc(val)+'"></div>';
    }
    box.appendChild(d);
  });

  /* 绑定 */
  box.querySelectorAll('[id^=f_]').forEach(inp=>{
    inp.onchange=()=>{
      const k=inp.id.slice(2);
      snapshot();
      if(k==='parent'){
        const pos=absOf(w); w.parent=+inp.value;
        const root=w.parent>=0?absOf(wid(w.parent)):{x:0,y:0};
        w.x=pos.x-root.x; w.y=pos.y-root.y;
        if(w.parent>S.sel){
          const parent=wid(w.parent), subtree=new Set(selectedTree().map(wid));
          const next=scr().widgets.filter(o=>!subtree.has(o));
          next.splice(next.indexOf(parent)+1,0,...subtree);
          remapWidgets(next);setSelection([next.indexOf(w)]);
        }
      }
      else if(k==='name'){ w.name=inp.value||('w'+S.seq++); }
      else if(k==='bind'){
        w.bind = inp.value.trim();
        const vp = VARPOOL.find(v=>v.name===w.bind);   /* 从导入的 task 里认出来的变量 */
        if(vp) w.bindType = vp.type;
      }
      else if(inp.type==='checkbox'){ w[k]=inp.checked?1:0; }
      else if(inp.type==='number'){ w[k]=inp.value===''?0:+inp.value; }
      else { w[k]=inp.value; }
      renderAll();
    };
  });
}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- 交互：选择 / 拖动 / 缩放 ---------- */
/* 选择与几何均留在编辑器；固件工程数据仍只包含原来的控件数组。 */
let selected = new Set(), selectionPage = null, widgetClipboard = null;
let drag = null;
function setSelection(indices){
  selected = new Set(indices.filter(i=>Number.isInteger(i) && wid(i)));
  S.sel = Array.from(selected).pop() ?? -1;
  selectionPage = scr();
}
function syncSelection(){
  if(selectionPage!==scr() || !selected.has(S.sel) || !wid(S.sel)) setSelection([S.sel]);
}
function pickWidget(i, extend){
  if(!extend){ setSelection([i]); return; }
  const next=new Set(selected);
  if(next.has(i)) next.delete(i); else next.add(i);
  setSelection([...next]);
}
function hasSelectedAncestor(w, indices){
  const visited=new Set();
  for(let p=w.parent; p!=null && p>=0 && wid(p) && !visited.has(p); p=wid(p).parent){
    if(indices.has(p)) return true;
    visited.add(p);
  }
  return false;
}
function selectionRoots(){
  return [...selected].filter(i=>!hasSelectedAncestor(wid(i), selected));
}
function selectedTree(){
  return scr().widgets.map((w,i)=>i).filter(i=>selected.has(i) || hasSelectedAncestor(wid(i),selected));
}
function boundsOf(indices){
  const boxes=indices.map(i=>{const w=wid(i);return {...absOf(w),w:w.w,h:w.h};});
  const x=Math.min(...boxes.map(b=>b.x)), y=Math.min(...boxes.map(b=>b.y));
  const right=Math.max(...boxes.map(b=>b.x+b.w)), bottom=Math.max(...boxes.map(b=>b.y+b.h));
  return {x,y,w:right-x,h:bottom-y};
}
function remapWidgets(next){
  const old=scr().widgets, positions=new Map(next.map((w,i)=>[w,i]));
  for(const w of next) w.parent=positions.get(old[w.parent]) ?? -1;
  scr().widgets=next;
}
function removeSelected(){
  if(!selected.size) return;
  const removed=new Set(selectedTree());
  snapshot();
  remapWidgets(scr().widgets.filter((w,i)=>!removed.has(i)));
  setSelection([]); renderAll();
}
function moveLayer(dir){
  if(!selected.size) return;
  const old=scr().widgets, next=old.slice(), chosen=new Set([...selected].map(wid));
  for(let i=dir>0?next.length-2:1; dir>0?i>=0:i<next.length; i-=dir){
    const a=next[i], b=next[i+dir];
    if(!chosen.has(a) || chosen.has(b)) continue;
    if(old[a.parent]===b || old[b.parent]===a) continue;
    [next[i],next[i+dir]]=[b,a];
  }
  if(next.every((w,i)=>w===old[i])) return;
  snapshot(); remapWidgets(next);
  setSelection([...chosen].map(w=>next.indexOf(w))); renderAll();
}
function copyWidgets(){
  if(!selected.size) return null;
  const indices=selectedTree(), offsets=new Map(indices.map((i,n)=>[i,n]));
  return {page:scr(),items:indices.map(i=>{
    const w=wid(i);
    return {value:JSON.parse(JSON.stringify(w)), parent:offsets.get(w.parent) ?? -1,
      externalParent:wid(w.parent), absolute:absOf(w), selected:selected.has(i)};
  })};
}
function pasteWidgets(clip){
  if(!clip) return;
  snapshot();
  const a=scr().widgets, first=a.length, chosen=[];
  const names=new Set(S.screens.flatMap(page=>page.widgets.map(w=>String(w.name).toLowerCase())));
  const roots=clip.items.filter(item=>item.parent<0);
  const gap=(pos,size,limit)=>Math.max(-Math.min(...roots.map(it=>it.absolute[pos])),
    Math.min(12,limit-Math.max(...roots.map(it=>it.absolute[pos]+it.value[size]))));
  const dx=gap('x','w',W_()), dy=gap('y','h',H_());
  for(const item of clip.items){
    const w={...item.value};
    do {w.name=w.type+(S.seq++);} while(names.has(w.name.toLowerCase()));
    names.add(w.name.toLowerCase());
    if(item.parent>=0) w.parent=first+item.parent;
    else{
      w.parent=clip.page===scr()?a.indexOf(item.externalParent):-1;
      const pa=w.parent>=0?absOf(wid(w.parent)):{x:0,y:0};
      w.x=item.absolute.x+dx-pa.x; w.y=item.absolute.y+dy-pa.y;
    }
    if(item.selected) chosen.push(a.length);
    a.push(w);
  }
  setSelection(chosen); renderAll();
}
function alignWidgets(mode){
  const roots=selectionRoots(); if(!roots.length) return;
  const axis=['l','c','r','dx'].includes(mode)?'x':'y', size=axis==='x'?'w':'h';
  const boxes=roots.map(i=>({i,pos:absOf(wid(i))[axis],size:wid(i)[size]}));
  const single=boxes.length===1;
  const lo=single?0:Math.min(...boxes.map(b=>b.pos));
  const hi=single?(axis==='x'?W_():H_()):Math.max(...boxes.map(b=>b.pos+b.size));
  if(mode==='dx' || mode==='dy'){
    if(boxes.length<3) return;
    boxes.sort((a,b)=>a.pos-b.pos || a.i-b.i);
    const last=boxes[boxes.length-1];
    const span=last.pos+last.size-boxes[0].pos;
    const gap=(span-boxes.reduce((sum,b)=>sum+b.size,0))/(boxes.length-1);
    snapshot();
    let pos=boxes[0].pos;
    for(const b of boxes){wid(b.i)[axis]+=Math.round(pos)-b.pos; pos+=b.size+gap;}
  }else{
    snapshot();
    for(const b of boxes){
      let pos;
      if(mode==='l' || mode==='t') pos=lo+(single?8:0);
      else if(mode==='r' || mode==='b') pos=hi-b.size-(single?8:0);
      else pos=(lo+hi-b.size)/2;
      wid(b.i)[axis]+=Math.round(pos)-b.pos;
    }
  }
  renderAll();
}
function canvasPoint(e){
  const rect=$('#canvas').getBoundingClientRect();
  return {x:(e.clientX-rect.left)/S.zoom, y:(e.clientY-rect.top)/S.zoom};
}
function drawMarquee(start,end){
  const x=Math.min(start.x,end.x), y=Math.min(start.y,end.y);
  const r={x,y,w:Math.abs(start.x-end.x),h:Math.abs(start.y-end.y)};
  const box=el('div','marquee');
  Object.assign(box.style,{left:x+'px',top:y+'px',width:r.w+'px',height:r.h+'px'});
  const g=$('#guides'); g.replaceChildren(box);
  return r;
}
$('#canvas').addEventListener('pointerdown',e=>{
  if(e.button!==0 || drag) return;
  const canvas=$('#canvas'), elem=e.target.closest('.w'), dir=e.target.dataset.dir;
  const point=canvasPoint(e), extend=e.ctrlKey || e.metaKey || e.shiftKey;
  if(!elem){
    if(!extend) setSelection([]);
    drag={mode:'box',base:[...selected]};
  }else{
    const i=+elem.dataset.i;
    if(extend || !selected.has(i)) pickWidget(i,extend);
    if(!selected.has(i)){renderAll();e.preventDefault();return;}
    const w=wid(i), roots=selectionRoots();
    drag={mode:dir?'resize':'move',dir,i,singleOnClick:!extend && selected.size>1,bounds:boundsOf(dir?[i]:selectedTree()),
      roots:roots.map(idx=>({w:wid(idx),x:wid(idx).x,y:wid(idx).y})),
      origin:{...absOf(w),xRel:w.x,yRel:w.y,w:w.w,h:w.h},
      targets:snapTargets(new Set(selectedTree()))};
  }
  Object.assign(drag,{point,pointerId:e.pointerId,page:scr(),changed:false});
  canvas.setPointerCapture(e.pointerId);
  renderAll();e.preventDefault();
});

/* ---------- 坐标与吸附 ---------- */
function absOf(w){
  let x=w.x, y=w.y, p=w.parent, g=0;
  while(p!=null && p>=0 && g++<32){ const P=scr().widgets[p]; if(!P)break; x+=P.x; y+=P.y; p=P.parent; }
  return {x:x, y:y};
}
function snapTargets(excluded){
  const xs=[0, Math.round(W_()/2), W_()], ys=[0, Math.round(H_()/2), H_()];
  scr().widgets.forEach((o,i)=>{
    if(excluded.has(i)) return;
    const a=absOf(o);
    xs.push(a.x, Math.round(a.x+o.w/2), a.x+o.w);
    ys.push(a.y, Math.round(a.y+o.h/2), a.y+o.h);
  });
  return {xs:xs, ys:ys};
}
/* 一维吸附：左/中/右三条边分别贴向候选线，取最近的一条 */
function snapAxis(pos, size, lines, thr){
  let bestLine=null, bestOff=0, bestD=thr+1;
  [0, size/2, size].forEach(k=>{
    lines.forEach(L=>{
      const d=Math.abs(pos+k-L);
      if(d<bestD){ bestD=d; bestLine=L; bestOff=L-(pos+k); }
    });
  });
  return bestLine==null ? {pos:pos, line:null} : {pos:Math.round(pos+bestOff), line:bestLine};
}
function drawGuides(gx, gy){
  const g=document.getElementById('guides'); if(!g)return;
  g.innerHTML='';
  if(gx!=null){ const d=el('div','guide v'); d.style.left=gx+'px'; g.appendChild(d); }
  if(gy!=null){ const d=el('div','guide h'); d.style.top=gy+'px'; g.appendChild(d); }
}

function clampDelta(value, start, length, limit){
  const min=Math.min(0,-start), max=Math.max(0,limit-start-length);
  return Math.round(Math.max(min,Math.min(max,value)));
}
window.addEventListener('pointermove',e=>{
  if(!drag || drag.pointerId!==e.pointerId || drag.page!==scr()) return;
  const point=canvasPoint(e), dx=point.x-drag.point.x, dy=point.y-drag.point.y;
  if(!drag.changed && Math.hypot(dx,dy)*S.zoom<3) return;
  if(drag.mode==='box'){
    drag.changed=true;
    const r=drawMarquee(drag.point,point);
    const hits=scr().widgets.map((w,i)=>i).filter(i=>{
      const w=wid(i), p=absOf(w);
      return p.x>=r.x && p.y>=r.y && p.x+w.w<=r.x+r.w && p.y+w.h<=r.y+r.h;
    });
    setSelection(drag.base.concat(hits));
    renderAll();drawMarquee(drag.point,point);
    return;
  }
  if(!drag.changed){drag.before=JSON.stringify(S.screens);drag.changed=true;}
  const mode=e.altKey?'off':S.snapMode, t=drag.targets;
  const grid=mode==='grid' || mode==='both', smart=mode==='smart' || mode==='both';
  const snap=(pos,size,lines)=>{
    const value=grid?Math.round(pos/8)*8:pos;
    return smart?snapAxis(value,size,lines,6):{pos:value,line:null};
  };
  let gx=null,gy=null;
  if(drag.mode==='move'){
    const b=drag.bounds;
    const sx=snap(b.x+dx,b.w,t.xs), sy=snap(b.y+dy,b.h,t.ys);
    const mx=clampDelta(sx.pos-b.x,b.x,b.w,W_()), my=clampDelta(sy.pos-b.y,b.y,b.h,H_());
    for(const r of drag.roots){r.w.x=r.x+mx;r.w.y=r.y+my;}
    gx=sx.line; gy=sy.line;
  }else{
    const w=wid(drag.i), o=drag.origin, d=drag.dir;
    let l=o.x, r=o.x+o.w, top=o.y, bot=o.y+o.h;
    if(d.includes('w')){const s=snap(l+dx,0,t.xs);l=Math.min(r-8,Math.round(s.pos));gx=s.line;}
    if(d.includes('e')){const s=snap(r+dx,0,t.xs);r=Math.max(l+8,Math.round(s.pos));gx=s.line;}
    if(d.includes('n')){const s=snap(top+dy,0,t.ys);top=Math.min(bot-8,Math.round(s.pos));gy=s.line;}
    if(d.includes('s')){const s=snap(bot+dy,0,t.ys);bot=Math.max(top+8,Math.round(s.pos));gy=s.line;}
    w.x=o.xRel+l-o.x; w.y=o.yRel+top-o.y; w.w=r-l;w.h=bot-top;
  }
  renderCanvas();drawGuides(gx,gy);renderInspector();
});
function finishGesture(cancel){
  if(!drag) return;
  const active=drag; drag=null;
  const canvas=$('#canvas');
  if(canvas.hasPointerCapture(active.pointerId))canvas.releasePointerCapture(active.pointerId);
  if(active.page!==scr())return;
  if(active.mode==='box' && cancel) setSelection(active.base);
  if(!cancel && !active.changed && active.singleOnClick) setSelection([active.i]);
  if(active.before && cancel){
    for(const r of active.roots){r.w.x=r.x;r.w.y=r.y;}
    if(active.mode==='resize') Object.assign(wid(active.i),{w:active.origin.w,h:active.origin.h});
  }else if(active.before && active.before!==JSON.stringify(S.screens)) recordSnapshot(active.before);
  renderAll();
}
window.addEventListener('pointerup',e=>{if(drag?.pointerId===e.pointerId) finishGesture(false);});
window.addEventListener('pointercancel',e=>{if(drag?.pointerId===e.pointerId) finishGesture(true);});
$('#canvas').addEventListener('lostpointercapture',e=>{if(drag?.pointerId===e.pointerId) finishGesture(true);});
$('#canvas').addEventListener('pointermove',e=>{
  const p=canvasPoint(e);$('#stPos').textContent='x '+Math.round(p.x)+'  y '+Math.round(p.y);
});
window.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]')) return;
  if($('#codeMask').classList.contains('on')){
    if(e.key==='Escape')$('#codeMask').classList.remove('on');
    return;
  }
  if(e.target.closest('input,textarea,select,[contenteditable="true"],dialog,[role="dialog"]')) return;
  const ctrl=e.ctrlKey || e.metaKey, key=e.key.toLowerCase();
  if(key==='escape'){
    if(drag)finishGesture(true);else{setSelection([]);renderAll();}return;
  }
  if(drag)return;
  if(ctrl){
    if(!['z','y','a','d','c','v'].includes(key)) return;
    if((key==='c'||key==='d')&&!selected.size || key==='v'&&!widgetClipboard) return;
    e.preventDefault();
    if(key==='z'){if(e.shiftKey)redo();else undo();}
    if(key==='y')redo();
    if(key==='a'){setSelection(scr().widgets.map((w,i)=>i));renderAll();}
    if(key==='d')pasteWidgets(copyWidgets());
    if(key==='c')widgetClipboard=copyWidgets();
    if(key==='v')pasteWidgets(widgetClipboard);
    return;
  }
  if(!selected.size)return;
  if(key==='delete'||key==='backspace'){e.preventDefault();removeSelected();return;}
  const arrows={arrowleft:[-1,0],arrowright:[1,0],arrowup:[0,-1],arrowdown:[0,1]};
  if(!arrows[key])return;
  e.preventDefault();
  const step=e.shiftKey?10:1, b=boundsOf(selectedTree());
  const dx=clampDelta(arrows[key][0]*step,b.x,b.w,W_()), dy=clampDelta(arrows[key][1]*step,b.y,b.h,H_());
  if(!dx && !dy)return;
  snapshot(); for(const i of selectionRoots()){wid(i).x+=dx;wid(i).y+=dy;}
  renderAll();
});

/* ---------- 查看 / 复制代码（两个页签） ---------- */
let TAB = 'ui';          /* 'ui' | 'task' */

function fillCode(kind){
  TAB = kind;
  let g;
  try{g=genCode();}
  catch(error){
    $('#codeOut').value=error.message;
    $('#codeName').textContent='检查控件属性';
    $('#codeHint').textContent='修正后可以重新生成代码';
    $('#btnCopyCode').disabled=true;
    return;
  }
  $('#btnCopyCode').disabled=false;

  if(kind === 'task' && TASKSRC){
    $('#codeOut').value        = patchTask();
    $('#codeName').textContent = TASKNAME || (g.prefix + '_task.c');
    $('#codeHint').textContent = patchTaskSummary();
  }else{
    $('#codeOut').value        = g.combined;
    $('#codeName').textContent = g.prefix + '.c';
    $('#codeHint').textContent = '整段复制，粘到一个 .c 里就能编；末尾 #if 0 里是头文件和 task 骨架';
  }

  $('#tabUI').classList.toggle('on',   kind === 'ui');
  $('#tabTask').classList.toggle('on', kind === 'task');
  $('#codeOut').scrollTop = 0;
}

function openCode(){
  try { fillCode((TAB === 'task' && TASKSRC) ? 'task' : 'ui'); }
  catch(error){ alert(error.message); return; }
  $('#codeMask').classList.add('on');
  $('#codeOut').focus();
  $('#codeOut').setSelectionRange(0,0);
  $('#codeOut').scrollTop = 0;
  setTimeout(()=>{ $('#codeOut').scrollTop = 0; }, 0);
}

$('#tabUI').onclick   = () => fillCode('ui');
$('#tabTask').onclick = () => { if(TASKSRC) fillCode('task'); };
$('#btnCode').onclick = openCode;
$('#btnCloseCode').onclick = () => $('#codeMask').classList.remove('on');
$('#codeMask').onclick = e => { if(e.target.id === 'codeMask') $('#codeMask').classList.remove('on'); };
$('#btnCopyCode').onclick = async () => {
  const txt = $('#codeOut').value;
  try { await navigator.clipboard.writeText(txt); }
  catch(e){ $('#codeOut').select(); document.execCommand('copy'); }
  $('#btnCopyCode').textContent = '已复制';
  setTimeout(() => { $('#btnCopyCode').textContent = '复制当前页'; }, 1500);
};

function validateProject(data){
  if(!data || !Array.isArray(data.screens) || !data.screens.length)
    throw new Error('请选择本设计器保存的工程 JSON，工程至少需要一页。');
  for(const [i,page] of data.screens.entries()){
    if(!page || typeof page.name!=='string' || !Array.isArray(page.widgets))
      throw new Error('第 '+(i+1)+' 页缺少页面名或控件列表。');
    for(const [j,w] of page.widgets.entries()){
      if(!w || !Object.hasOwn(W,w.type) || typeof w.name!=='string' ||
         !['x','y','w','h'].every(key=>Number.isFinite(w[key])))
        throw new Error(page.name+' 第 '+(j+1)+' 个控件的数据不完整或类型不受支持。');
      if(w.parent!=null && w.parent!==-1 &&
         (!Number.isInteger(w.parent) || w.parent<0 || page.widgets[w.parent]?.type!=='card'))
        throw new Error(page.name+' 内 '+w.name+' 的父卡片不存在。');
    }
    if(page.widgets.some((w,j)=>w.parent!=null && w.parent>=j)){
      const old=page.widgets,ordered=[],indices=new Map(),visiting=new Set();
      function place(index){
        if(indices.has(index)) return;
        if(visiting.has(index)) throw new Error(page.name+' 存在循环嵌套的卡片。');
        visiting.add(index);
        const w=old[index],p=w.parent;
        if(p!=null && p>=0) place(p);
        indices.set(index,ordered.length);
        ordered.push({...w,parent:indices.get(p) ?? -1});
        visiting.delete(index);
      }
      old.forEach((w,j)=>place(j));
      page.widgets=ordered;
    }
  }
  return data;
}
$('#fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{const d=validateProject(JSON.parse(r.result));
      clearImportedTask(); history=[];future=[];
      S.name=typeof d.name==='string' && d.name?d.name:'app_ui'; S.landscape=!!d.landscape;
      S.screens=d.screens; S.cur=0; S.sel=-1; S.seq=1;
      $('#projName').value=S.name;
      (S.landscape?$('#btnLandscape'):$('#btnPortrait')).click();
      renderAll();}catch(err){alert('文件解析失败：'+err.message);} };
  r.readAsText(f);
  e.target.value='';
};

/* ---------- GBK 编码（生成的 .c/.h 直接进 MRS 不乱码） ---------- */

:'B8F1','框':'BFF2','横':'BAE1','次':'B4CE','毁':'BBD9','每':'C3BF','没':'C3BB','活':'BBEE','清':'C7E5','渲':'E4D6','源':'D4B4','滑':'BBAC','滚':'B9F6','灯':'B5C6','点':'B5E3','父':'B8B8','片':'C6AC','版':'B0E6','状':'D7B4','理':'C0ED','生':'C9FA','用':'D3C3','由':'D3C9','画':'BBAD','界':'BDE7','的':'B5C4','盘':'C5CC','直':'D6B1','矩':'BED8','码':'C2EB','础':'B4A1','示':'CABE','称':'B3C6','移':'D2C6','程':'B3CC','空':'BFD5','竖':'CAFA','符':'B7FB','第':'B5DA','签':'C7A9','算':'CBE3','素':'CBD8','级':'BCB6','线':'CFDF','绑':'B0F3','给':'B8F8','缀':'D7BA','缓':'BBBA','编':'B1E0','缩':'CBF5','网':'CDF8','联':'C1AA','自':'D7D4','色':'C9AB','落':'C2E4','行':'D0D0','表':'B1ED','要':'D2AA','观':'B9DB','视':'CAD3','角':'BDC7','解':'BDE2','计':'BCC6','认':'C8CF','设':'C9E8','语':'D3EF','说':'CBB5','读':'B6C1','调':'B5F7','象':'CFF3','败':'B0DC','资':'D7CA','起':'C6F0','身':'C9ED','转':'D7AA','轮':'C2D6','输':'CAE4','还':'BBB9','这':'D5E2','进':'BDF8','选':'D1A1','避':'B1DC','部':'B2BF','采':'B2C9','里':'C0EF','重':'D6D8','量':'C1BF','钮':'C5A5','销':'CFFA','键':'BCFC','阵':'D5F3','附':'B8BD','除':'B3FD','隔':'B8F4','集':'BCAF','需':'D0E8','面':'C3E6','页':'D2B3','顶':'B6A5','项':'CFEE','颜':'D1D5','额':'B6EE','首':'CAD7','骨':'B9C7','高':'B8DF','默':'C4AC','齐':'C6EB','（':'A3A8','）':'A3A9','，':'A3AC','：':'A3BA','；':'A3BB','？':'A3BF'};
function encGBK(s){
  const out=[];
  for(const ch of s){
    const c=ch.codePointAt(0);
    if(c<0x80){ out.push(c); continue; }
    const hex=GBK_TBL[ch];
    if(hex){ out.push(parseInt(hex.slice(0,2),16)); out.push(parseInt(hex.slice(2),16)); }
    else { out.push(0x3F); }              /* 表里没有的字符 -> '?' */
  }
  return new Uint8Array(out);
}

function download(name,text,mime){
  const isC = /\.(c|h)$/i.test(name);
  const payload = isC ? encGBK(text) : new TextEncoder().encode(text);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([payload],{type:mime||'text/plain'}));
  a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}

/* 生成单个控件的 C 语句 */
function genWidget(w,idx,varMap,parentVar){
  const v='w'+idx;
  const p=parentVar;
  const L=[];
  const px = w.x===0?0:w.x, py = w.y===0?0:w.y, pw=w.w, ph=w.h;
  const guardStart = W[w.type].need ? ('#if '+W[w.type].need) : null;
  const guardEnd   = W[w.type].need ? '#endif' : null;

  switch(w.type){
    case 'card':
      L.push(v+' = ui_card_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+(w.radius||22)+');');
      break;
    case 'label':
      L.push(v+' = ui_label_at('+p+', '+(COLORS[w.color]||'UI_C_TEXT')+', '+cstr(w.text)+', '+px+', '+py+');');
      if((w.longMode||'none')==='wrap')
        L.push('lv_label_set_long_mode('+v+', LV_LABEL_LONG_WRAP);  lv_obj_set_width('+v+', '+pw+');');
      else if(w.longMode==='dot')
        L.push('lv_label_set_long_mode('+v+', LV_LABEL_LONG_DOT);   lv_obj_set_width('+v+', '+pw+');');
      else if(w.longMode==='scroll')
        L.push('lv_label_set_long_mode('+v+', LV_LABEL_LONG_SCROLL_CIRCULAR); lv_obj_set_width('+v+', '+pw+');');
      break;
    case 'btn':
      L.push(v+' = ui_btn_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+cstr(w.text)+', '+(w.code|0)+');');
      if(w.btnStyle==='primary'){
        L.push('lv_obj_set_style_bg_color('+v+', UI_C_ACCENT, 0);');
        L.push('if(lv_obj_get_child('+v+', 0) != NULL) { lv_obj_set_style_text_color(lv_obj_get_child('+v+', 0), lv_color_white(), 0); }');
      }else if(w.btnStyle==='warn'){
        L.push('lv_obj_set_style_bg_color('+v+', UI_C_VALUE, 0);');
        L.push('if(lv_obj_get_child('+v+', 0) != NULL) { lv_obj_set_style_text_color(lv_obj_get_child('+v+', 0), lv_color_white(), 0); }');
      }else if(w.btnStyle==='ghost'){
        L.push('lv_obj_set_style_bg_opa('+v+', LV_OPA_TRANSP, 0);');
        L.push('lv_obj_set_style_border_color('+v+', UI_C_ACCENT, 0);');
      }
      break;
    case 'bar':
      if((w.barDir||'h')==='v'){
        /* 8.2 的 lv_bar 只能横着，竖向用"轨道 + 填充"两层 obj 拼 */
        const fillW = Math.max(4, pw - 4);
        L.push('/* 竖向进度条：轨道 + 填充（8.2 的 lv_bar 不支持竖向） */');
        L.push(v+' = ui_card_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+Math.round(pw/2)+');');
        L.push('lv_obj_set_style_bg_color('+v+', UI_C_BORDER, 0);');
        L.push(v+'_fill = lv_obj_create('+v+');');
        L.push('lv_obj_set_size('+v+'_fill, '+fillW+', 0);');
        L.push('lv_obj_set_style_radius('+v+'_fill, '+Math.round(fillW/2)+', 0);');
        L.push('lv_obj_set_style_bg_color('+v+'_fill, UI_C_ACCENT, 0);');
        L.push('lv_obj_set_style_bg_opa('+v+'_fill, LV_OPA_COVER, 0);');
        L.push('lv_obj_set_style_border_width('+v+'_fill, 0, 0);');
        L.push('lv_obj_set_style_pad_all('+v+'_fill, 0, 0);');
        L.push('lv_obj_clear_flag('+v+'_fill, LV_OBJ_FLAG_SCROLLABLE);');
        L.push('lv_obj_align('+v+'_fill, LV_ALIGN_BOTTOM_MID, 0, -2);');
        GEN_AUX.decl.push('static lv_obj_t *'+v+'_fill = NULL;   /* '+w.name+' 的填充块 */');
        GEN_AUX.vbar.push({v:v, name:w.name, max:(w.max|0||100), h:ph, w:fillW});
      }else{
        L.push(v+' = ui_bar_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+(w.min|0)+', '+(w.max|0)+');');
        L.push('ui_bar_set('+v+', '+(w.val|0)+');');
      }
      break;
    case 'slider':
      L.push(v+' = ui_slider_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+(w.min|0)+', '+(w.max|0)+', '+(w.val|0)+', '+(w.code|0)+');');
      break;
    case 'chart':
      L.push(v+' = ui_chart_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+(w.max|0)+');');
      L.push('lv_chart_set_point_count('+v+', '+(w.points|0||64)+');');
      L.push('lv_chart_set_div_line_count('+v+', '+(w.divH|0||4)+', '+(w.divV|0||6)+');');
      if(w.chartType==='bar') L.push('lv_chart_set_type('+v+', LV_CHART_TYPE_BAR);');

      /* Y 轴刻度：让 LVGL 自己在左侧标数字（label_en = true） */
      if((w.yTicks|0) > 0){
        L.push('lv_chart_set_axis_tick('+v+', LV_CHART_AXIS_PRIMARY_Y, 4, 2, '+(w.yTicks|0)+', 1, true, 40);');
        L.push('lv_obj_set_style_text_color('+v+', UI_C_TEXT_DIM, LV_PART_TICKS);');
      }

      /* Y 轴单位：图表左上角一个小字，不占句柄 */
      if((w.yUnit||'').trim()){
        L.push('{   /* Y 轴单位 */');
        L.push('    lv_obj_t *u = ui_label_text('+p+', UI_C_TEXT_DIM, '+cstr(w.yUnit.trim())+');');
        L.push('    lv_obj_align_to(u, '+v+', LV_ALIGN_OUT_TOP_LEFT, 0, -14);');
        L.push('}');
      }

      /* 外部数组模式：数组 + 绑定（任务里直接写数组，零拷贝） */
      if(w.dataSrc==='ext'){
        const n=(w.points|0||64);
        GEN_AUX.decl.push('#if '+W.chart.need);
        GEN_AUX.decl.push('static int16_t s_'+v+'_dat['+n+'];   /* '+w.name+' 的外部数据数组 */');
        GEN_AUX.decl.push('#endif');
        L.push('ui_chart_bind('+v+', s_'+v+'_dat, '+n+', 1);   /* 之后写数组即可 */');
      }
      break;
    case 'switch':
      L.push(v+' = ui_switch_new('+p+', '+px+', '+py+', '+(w.code|0)+');');
      if(String(w.initOn)==='1') L.push('lv_obj_add_state('+v+', LV_STATE_CHECKED);');
      break;
    case 'checkbox':
      L.push(v+' = ui_checkbox_new('+p+', '+px+', '+py+', '+cstr(w.text)+', '+(w.code|0)+');');
      if(String(w.initOn)==='1') L.push('lv_obj_add_state('+v+', LV_STATE_CHECKED);');
      break;
    case 'arc':
      L.push(v+' = ui_arc_new('+p+', '+px+', '+py+', '+pw+', '+(w.min|0)+', '+(w.max|0)+', '+(w.val|0)+', '+(w.code|0)+');');
      if(w.angStart!==undefined || w.angEnd!==undefined)
        L.push('lv_arc_set_bg_angles('+v+', '+(w.angStart|0||135)+', '+(w.angEnd|0||45)+');');
      break;
    case 'dropdown':
      L.push(v+' = ui_dropdown_new('+p+', '+px+', '+py+', '+pw+', '+cstr(w.options)+', '+(w.code|0)+');');
      if((w.selected|0) > 0) L.push('lv_dropdown_set_selected('+v+', '+(w.selected|0)+');');
      break;
    case 'roller':
      L.push(v+' = ui_roller_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+cstr(w.options)+', '+(w.code|0)+');');
      if((w.visible|0) > 0) L.push('lv_roller_set_visible_row_count('+v+', '+(w.visible|0)+');');
      if((w.selected|0) > 0) L.push('lv_roller_set_selected('+v+', '+(w.selected|0)+', LV_ANIM_OFF);');
      break;
    case 'textarea':
      L.push(v+' = ui_textarea_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+cstr(w.text)+', '+(w.code|0)+');');
      if(String(w.oneLine)!=='0') L.push('lv_textarea_set_one_line('+v+', true);');
      if((w.maxLen|0) > 0)       L.push('lv_textarea_set_max_length('+v+', '+(w.maxLen|0)+');');
      if(String(w.password)==='1') L.push('lv_textarea_set_password_mode('+v+', true);');
      break;
    case 'keyboard':
      L.push(v+' = ui_keyboard_new('+p+', '+pw+', '+(w.code|0)+');');
      break;
    case 'calendar':
      L.push(v+' = ui_calendar_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+(w.code|0)+');');
      break;
    case 'led':
      L.push(v+' = ui_led_new('+p+', '+px+', '+py+', '+pw+', '+(COLORS[w.color]||'UI_C_ACCENT')+');');
      if(String(w.initOn)==='0') L.push('lv_led_off('+v+');');
      break;
    case 'spinner':
      L.push(v+' = ui_spinner_new('+p+', '+px+', '+py+', '+pw+', '+(w.ms|0||1000)+');');
      break;
    case 'table':
      L.push(v+' = ui_table_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+(w.rows|0||3)+', '+(w.cols|0||3)+');');
      if((w.headers||'').trim()){
        const cols=Math.max(1, Math.min(8, w.cols|0||3));
        const hs=(w.headers||'').split(',').slice(0, cols);
        L.push('lv_table_set_col_width('+v+', 0, '+Math.round(pw/cols)+');   /* 其余列同宽 */');
        for(let c=0;c<cols;c++) L.push('lv_table_set_cell_value('+v+', 0, '+c+', '+cstr((hs[c]||'').trim())+');');
      }
      break;
    case 'meter':
      L.push(v+' = ui_meter_new('+p+', '+px+', '+py+', '+pw+', '+(w.min|0)+', '+(w.max|0)+', '+(w.val|0)+');');
      break;
    case 'line':
      L.push('static const lv_point_t '+v+'_pts[] = {{0, '+Math.max(0,ph-1)+'}, {'+Math.max(0,pw-1)+', 0}};');
      L.push(v+' = ui_line_new('+p+', '+v+'_pts, 2, UI_C_ACCENT);');
      L.push('lv_obj_set_pos('+v+', '+px+', '+py+');');
      break;
    case 'img': {
      const asset=String(w.imgName ?? '').trim();
      if(asset){
        const reserved=/^(?:auto|break|case|char|const|continue|default|do|double|else|enum|extern|float|for|goto|if|inline|int|long|register|restrict|return|short|signed|sizeof|static|struct|switch|typedef|union|unsigned|void|volatile|while|_Bool|_Complex|_Imaginary)$/;
        if(!/^[A-Za-z_]\w*$/.test(asset) || reserved.test(asset))
          throw new Error('图片控件「'+w.name+'」的资源变量名「'+asset+'」不是有效的 C 标识符。请填写资源变量名，或留空使用内置图标。');
        L.push('LV_IMG_DECLARE('+asset+');');
      }
      L.push(v+' = ui_img_new('+p+', '+px+', '+py+', '+(asset?'&'+asset:'LV_SYMBOL_IMAGE')+');');
      break;
    }
    case 'canvas':
      GEN_AUX.decl.push('#if LV_USE_CANVAS');
      GEN_AUX.decl.push('static lv_color_t '+v+'_buf['+(pw*ph)+'];   /* '+w.name+' 画布缓冲：'+(pw*ph*2)+' 字节 RAM */');
      GEN_AUX.decl.push('#endif');
      L.push(v+' = ui_canvas_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+v+'_buf);');
      break;
    case 'btnmatrix':{
      const labels=[];
      for(const row of matrixRows(w)){
        if(labels.length) labels.push('\n');
        labels.push(...row);
      }
      labels.push('');  /* LVGL 的字符串表以空字符串结束 */
      L.push('static const char *'+v+'_map[] = {'+labels.map(cstr).join(', ')+'};');
      L.push(v+' = ui_btnmatrix_new('+p+', '+px+', '+py+', '+pw+', '+ph+', '+v+'_map, '+(w.code|0)+');');
      break;
    }
    default:
      L.push('/* 未支持的控件: '+w.type+' */');
  }
  return {lines:L, guardStart, guardEnd, var:v};
}

function genCode(){
  GEN_AUX = { decl: [], vbar: [] };

  /* 每次生成都从输入框读前缀，改完名字立刻生效 */
  S.name = ($('#projName').value || S.name || 'app_ui').trim();
  const prefix=(S.name||'app_ui').replace(/[^A-Za-z0-9_]/g,'_');
  const U=prefix.toUpperCase();
  const cnt=S.screens.length;
  const multi = (cnt > 1);          /* 单屏：render 不带 screen 参数，直接吃数据 */
  const need=[...new Set(S.screens.flatMap(s=>s.widgets.map(w=>W[w.type].need)).filter(Boolean))];

  /* 收集所有"绑定形参"：同名只保留一个，顺序按出现先后 */
  const binds=[];
  S.screens.forEach(s=>s.widgets.forEach(w=>{
    const nm=(w.bind||'').trim();
    if(!nm) return;
    if(binds.some(b=>b.name===nm)) return;
    binds.push({name:nm, type:w.bindType||'int32_t'});
  }));
  /* 单屏：render(c, ...)；多屏：render(uint8_t screen, c, ...) */
  const renderParams = [(multi ? 'uint8_t screen' : ''), binds.map(b=>b.type+' '+b.name).join(', ')]
                       .filter(Boolean).join(', ');
  const renderParamDecl = (renderParams === '') ? 'void' : renderParams;
  const renderCall = [(multi ? 'screen' : ''), binds.map(b=>b.name).join(', ')]
                     .filter(Boolean).join(', ');

  /* ---------- .h ---------- */
  const H=[];
  H.push('/* ============================================================');
  H.push(' * 文件名   : '+prefix+'.h');
  H.push(' * 说明     : 由 LVGL 可视化设计器生成（基于 APP/LVGL_DEMO/LVGL_Demo.h）');
  H.push(' * 屏幕     : '+(S.landscape?'横屏 480×320':'竖屏 320×480'));
  H.push(' * 修改方式 : 重新在设计器里改，别手改这个文件');
  H.push(' * ============================================================ */');
  H.push('');
  H.push('#ifndef __'+U+'_H');
  H.push('#define __'+U+'_H');
  H.push('');
  H.push('#include <stdint.h>');
  H.push('');
  if(need.length){
    H.push('/* 这个界面用到的控件宏（lv_conf.h 里要打开） */');
    need.forEach(m=>H.push('/*   '+m+' = 1 */'));
    H.push('');
  }
  /* 事件编号 */
  const ids=[];
  S.screens.forEach((s,si)=>s.widgets.forEach(w=>{ if(w.code!=null) ids.push({w,si}); }));
  if(ids.length){
    H.push('/* 交互控件的 TOUCH 事件编号（msg.code） */');
    ids.forEach(({w})=>{
      const nm=U+'_ID_'+String(w.name||'X').toUpperCase().replace(/[^A-Z0-9_]/g,'_');
      H.push('#define '+nm+'  '+(w.code|0));
    });
    H.push('');
  }
  if(multi){
    H.push('#ifndef '+U+'_SCREEN_CNT');
    H.push('#define '+U+'_SCREEN_CNT  '+cnt);
    H.push('#endif');
    H.push('');
  }
  H.push('/**');
  H.push(' * @brief  渲染页面（首次调用会建页，之后只 load + 更新数据）');
  if(multi) H.push(' * @param  screen  屏幕下标 0..'+(cnt-1)+'（对应：'+S.screens.map(s=>s.name).join(' / ')+'）');

    T.push('    for(;;)');
    T.push('    {');
    T.push('        if(rt_mq_recv(s_q, &msg, sizeof(msg), rt_tick_from_millisecond(100)) == RT_EOK)');
    T.push('        {');
    T.push('            if(msg.type == QUIT)');
    T.push('            {');
    T.push('                break;');
    T.push('            }');
    T.push('');
    T.push('            if(msg.type == KEY)');
    T.push('            {');
    T.push('                '+prefix+'_key((key_id_t)msg.code);');
    T.push('            }');
    T.push('            else if(msg.type == TOUCH)');
    T.push('            {');
    T.push('                '+prefix+'_set(msg.code, msg.value);');
    T.push('            }');
    T.push('        }');
    T.push('');
    T.push('        '+prefix+'_tick();');
    T.push('    }');
    T.push('');
    T.push('    rt_sem_release(s_exit);');
    T.push('}');
    T.push('');
    T.push('static void '+prefix+'_open(void)');
    T.push('{');
    T.push('    rt_thread_t tid;');
    T.push('');
    T.push('    if(s_q != RT_NULL)');
    T.push('    {');
    T.push('        return;');
    T.push('    }');
    T.push('');
    T.push('    s_screen = 0;');
    T.push('');
    T.push('    s_exit = rt_sem_create("'+prefix.slice(0,5)+'ex", 0, RT_IPC_FLAG_FIFO);');
    T.push('    s_q    = rt_mq_create("'+tn+'", sizeof(message), 4, RT_IPC_FLAG_FIFO);');
    T.push('    tid    = rt_thread_create("'+tn+'", '+prefix+'_thread, RT_NULL, 1024, 12, 10);');
    T.push('');
    T.push('    if((s_exit == RT_NULL) || (s_q == RT_NULL) || (tid == RT_NULL))');
    T.push('    {');
    T.push('        rt_kprintf("'+prefix.slice(0,5)+': open failed\\r\\n");');
    T.push('');
    T.push('        if(tid    != RT_NULL) { rt_thread_delete(tid); }');
    T.push('        if(s_q    != RT_NULL) { rt_mq_delete(s_q);       s_q    = RT_NULL; }');
    T.push('        if(s_exit != RT_NULL) { rt_sem_delete(s_exit);   s_exit = RT_NULL; }');
    T.push('        return;');
    T.push('    }');
    T.push('');
    T.push('    rt_thread_startup(tid);');
    T.push('}');
    T.push('');
    T.push('static void '+prefix+'_close(void)');
    T.push('{');
    T.push('    message bye = {QUIT, 0, 0};');
    T.push('    message drop;');
    T.push('    uint8_t retry;');
    T.push('');
    T.push('    if(s_q == RT_NULL)');
    T.push('    {');
    T.push('        return;');
    T.push('    }');
    T.push('');
    T.push('    for(retry = 0; retry < 20; retry++)');
    T.push('    {');
    T.push('        if(rt_mq_send(s_q, &bye, sizeof(bye)) == RT_EOK)');
    T.push('        {');
    T.push('            break;');
    T.push('        }');
    T.push('        (void)rt_mq_recv(s_q, &drop, sizeof(drop), 0);');
    T.push('    }');
    T.push('');
    T.push('    if(retry >= 20)');
    T.push('    {');
    T.push('        rt_kprintf("'+prefix.slice(0,5)+': quit msg failed\\r\\n");');
    T.push('        return;');
    T.push('    }');
    T.push('');
    T.push('    if(rt_sem_take(s_exit, rt_tick_from_millisecond(3000)) != RT_EOK)');
    T.push('    {');
    T.push('        rt_kprintf("'+prefix.slice(0,5)+': exit timeout\\r\\n");');
    T.push('        return;');
    T.push('    }');
    T.push('');
    T.push('    rt_mq_delete(s_q);      s_q    = RT_NULL;');
    T.push('    rt_sem_delete(s_exit);  s_exit = RT_NULL;');
    T.push('}');
    T.push('');
    T.push('static void '+prefix+'_post(const message *msg)');
    T.push('{');
    T.push('    if(s_q != RT_NULL)');
    T.push('    {');
    T.push('        (void)rt_mq_send(s_q, (void *)msg, sizeof(*msg));');
    T.push('    }');
    T.push('}');
    T.push('');
    T.push('static void '+prefix+'_redraw(void)');
    T.push('{');
    const redrawArgs = binds.map(b => b.type==='const char *' ? 's_'+b.name : '('+b.type+')s_'+b.name);
    if(multi) redrawArgs.unshift('s_screen');
    T.push('    '+prefix+'_render('+redrawArgs.join(', ')+');');
    T.push('}');
    T.push('');
    T.push('const task_t task_'+prefix+' =');
    T.push('{');
    T.push('    .name       = "'+tn+'",');
    T.push('    .keep       = 0,');
    T.push('');
    T.push('    .open       = '+prefix+'_open,');
    T.push('    .close      = '+prefix+'_close,');
    T.push('    .post       = '+prefix+'_post,');
    T.push('    .render     = '+prefix+'_redraw,');
    T.push('    .ui_destroy = '+prefix+'_destroy,');
    T.push('};');
  }

  /* ---- 拼成一份可直接复制的内容：.c 在前，.h / task 用 #if 0 包起来 ----
   * 选 #if 0 而不是注释块，这样 .h / task 里自身的注释不会被破坏，
   * 复制出去时只要删掉首尾的 #if 0 / #endif 两行即可。 */
  H.push('#endif');
  const parts = [];
  parts.push(C.join('\n'));
  parts.push('');
  parts.push('/* ============ ' + prefix + '.h（要单独头文件：把下面整段复制出去，');
  parts.push(' *              删掉首尾的 #if 0 / #endif 两行即可） ============ */');
  parts.push('#if 0');
  parts.push(H.join('\n'));
  parts.push('#endif  /* ' + prefix + '.h end */');
  if(T.length){
    parts.push('');
    parts.push('/* ============ task_' + prefix + '.c（同样用 #if 0 包着，可选） ============ */');
    parts.push('#if 0');
    parts.push(T.join('\n'));
    parts.push('#endif  /* task_' + prefix + '.c end */');
  }
  const combined = parts.join('\n') + '\n';

  return {header:H.join('\n')+'\n', source:C.join('\n')+'\n', task:T.join('\n')+'\n',
          prefix:prefix, combined:combined, renderCall:renderCall};
}

/* ---------- 导入 task .c：识别变量 + 同步出可直接复制的文本 ---------- */
let TASKSRC  = null;    /* 原始 task .c 的文本（自动判 utf-8 / gbk） */
let TASKNAME = '';
let TASKHEADERS = [];
let VARPOOL  = [];      /* [{name,type}] 从 task 里认出来的变量 */

/* 文件字节 -> 文本：先严格按 UTF-8 解，失败就当 GBK（工程里大多是 GBK） */
function decodeText(buf){
  try { return new TextDecoder('utf-8', {fatal:true}).decode(buf); }
  catch(e){
    try { return new TextDecoder('gbk').decode(buf); }
    catch(e2){
      let s=''; const CH=0x8000;
      for(let i=0;i<buf.length;i+=CH) s += String.fromCharCode.apply(null, buf.subarray(i,i+CH));
      return s;
    }
  }
}

/* 只推荐任务回调可引用的文件级标量和字符串；跳过函数体、形参和复合类型。 */
function inspectTaskC(text){
  const cleaned=text.replace(/\\\r?\n/g,'').replace(/^[ \t]*#[^\n]*|\/\*[\s\S]*?\*\/|\/\/[^\n]*|\bextern\s*"C"\s*\{|"(?:\\.|[^"\\])*"|'(?:\\.|[^'\\])*'/gm,' ');
  const result=new Map(),functions=new Set();
  const declaration=/^(?:(?:static|extern|const|volatile)\s+)*((?:rt_)?u?int(?:8|16|32)_t|float|double|char|(?:(?:un)?signed\s+)?(?:int|(?:short|long)(?:\s+int)?)|unsigned|signed)\b\s+([\s\S]+)$/;
  function recordFunction(raw){
    const signature=raw.trim().replace(/\s+/g,' ');
    if(!signature.startsWith('typedef ') && /^[\w\s*]+[\s*][A-Za-z_]\w*\s*\([^;{}]*\)$/.test(signature))
      functions.add(signature);
  }
  let statement='',depth=0,parens=0;
  for(const ch of cleaned){
    if(ch==='{'){ if(!depth){ recordFunction(statement); statement=''; } depth++; continue; }
    if(ch==='}'){ depth=Math.max(0,depth-1); continue; }
    if(depth) continue;
    if(ch==='(') parens++;
    if(ch===')') parens=Math.max(0,parens-1);
    if(ch!==';' || parens){ statement+=ch; continue; }
    recordFunction(statement);
    const match=statement.trim().replace(/\bchar\s*\*/g,'char *').match(declaration);
    statement='';
    if(!match) continue;
    for(const item of match[2].split(/,(?![^()]*\))/)){
      const field=item.trim().match(/^(\*?)\s*([A-Za-z_]\w*)\s*(\[[^\]]*\])?\s*(?:=[\s\S]*)?$/);
      if(!field || ((field[1] || field[3]) && match[1]!=='char')) continue;
      let type=match[1].replace(/^rt_/,'');
      if(/^(?:int|short|long|unsigned|signed)\b/.test(type))
        type=(/^unsigned\b/.test(type)?'u':'')+(/short/.test(type)?'int16_t':'int32_t');
      if(field[1] || field[3]) type='const char *';
      result.set(field[2],{name:field[2],type});
    }
  }
  return {variables:[...result.values()],functions:[...functions]};
}

function refreshVarPool(){
  $('#varpool').innerHTML = VARPOOL.map(v=>'<option value="'+v.name+'">'+v.type+'</option>').join('');
}

/* 把 task 源码里三处引用改成新名字，返回改好的整份文本 */
function patchTask(){
  if(!TASKSRC) return '';
  const g = genCode();
  let s = TASKSRC;

  /* 1) xxx_ui_render(...) 调用 -> <前缀>_render(<新实参>)；前面是 void 的是函数定义，跳过 */
  s = s.replace(/(?<!void\s)([A-Za-z_]\w*_ui_render)\s*\([^;]*?\)\s*;/g,
                g.prefix + '_render(' + g.renderCall + ');');
  /* 2) .ui_destroy = xxx */
  s = s.replace(/(\.ui_destroy\s*=\s*)[A-Za-z_]\w*/g, '$1' + g.prefix + '_destroy');
  /* 3) #include "ui/xxx.h" */
  s = s.replace(/(#include\s+"ui\/)[^"]+(")/g, '$1' + g.prefix + '.h$2');

  return s;
}

function patchTaskSummary(){
  const g = genCode();
  return '已同步 ' + (TASKNAME || 'task') + '：render 调用 / .ui_destroy / #include 三处';
}

$('#btnPickC').onclick = () => $('#fileC').click();
let taskImportId=0;
function clearImportedTask(){
  taskImportId++;
  TASKSRC=null; TASKNAME=''; TASKHEADERS=[]; VARPOOL=[]; TAB='ui';
  refreshVarPool();
  $('#tabTask').disabled=true;
  $('#taskBindingInfo').textContent='';
  $('#taskFunctions').hidden=true;
  $('#btnDetachTask').hidden=true;
}
$('#btnDetachTask').onclick=()=>{clearImportedTask();renderAll();};
$('#fileC').onchange = async e => {
  const files=Array.from(e.target.files);
  e.target.value='';
  if(!files.length) return;
  const sources=files.filter(f=>!f.name.toLowerCase().endsWith('.h'));
  if(sources.length>1){ alert('每个任务请选择一个业务 .c 文件，可以同时选择多个 .h。'); return; }
  const current=++taskImportId;
  try{
    const picked=await Promise.all(files.map(async file=>({name:file.name,text:decodeText(new Uint8Array(await file.arrayBuffer()))})));
    if(current!==taskImportId) return;
    const source=sources.length?picked.find(entry=>entry.name===sources[0].name):(TASKSRC?{name:TASKNAME,text:TASKSRC}:null);
    const headers=new Map((sources.length?[]:TASKHEADERS).map(h=>[h.name,h]));
    for(const h of picked.filter(item=>item!==source)) headers.set(h.name,h);
    const entries=source?[source,...headers.values()]:[...headers.values()];
    const variables=new Map(),signatures=new Set();
    for(const entry of entries){
      const parsed=inspectTaskC(entry.text);
      for(const variable of parsed.variables) variables.set(variable.name,variable);
      for(const signature of parsed.functions) signatures.add(signature);
    }
    TASKSRC=source?source.text:null;
    TASKNAME=source?source.name:'';
    TASKHEADERS=[...headers.values()];
    VARPOOL=[...variables.values()];
    refreshVarPool();
    $('#tabTask').disabled=!TASKSRC;
    if(!TASKSRC) TAB='ui';
    renderAll();
    $('#taskBindingInfo').textContent=entries.map(item=>item.name).join('、')+' · '+VARPOOL.length+' 个候选变量。';
    $('#btnDetachTask').hidden=false;
    const details=$('#taskFunctions');
    details.hidden=!signatures.size; details.open=false;
    details.querySelector('summary').textContent='任务函数（'+signatures.size+'）';
    details.querySelector('ul').replaceChildren(...[...signatures].map(s=>el('li','',s)));
  }catch(error){ if(current===taskImportId) alert('读取任务文件失败：'+error.message); }
};

/* ---------- 渲染总入口 ---------- */
function renderAll(){ syncSelection(); renderCanvas(); renderTabs(); renderLayers(); renderInspector();
  const n=selectionRoots().length;
  $('#alignTitle').textContent=n>1?'对齐选中控件':'对齐到页面';
  document.querySelectorAll('[data-al]').forEach(b=>{b.disabled=['dx','dy'].includes(b.dataset.al)?n<3:!n;});
  if(selected.size>1){$('#stSel').textContent='已选 '+selected.size+' 个控件';return;}

  $('#stSel').textContent = S.sel<0?'未选中':('已选：'+wid(S.sel).name+' ('+W[wid(S.sel).type].n+')');
}

/* ---------- 初始化 ---------- */
buildPalette();
$('#projName').value=S.name;
$('#btnDemo').click();
renderAll();
